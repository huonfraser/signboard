<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kanban Vibes</title>
<style>
  :root {
    --bg: #f4f5f7; --col: #ebecf0; --card: #fff; --text: #172b4d; --muted: #6b778c;
    --border: #dfe1e6; --accent: #d97757; --shadow: 0 1px 2px rgba(9,30,66,.2); --hover: rgba(9,30,66,.06);
    --low: #8993a4; --medium: #2684ff; --high: #ff991f; --urgent: #de350b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1d2125; --col: #282e33; --card: #22272b; --text: #dee4ea; --muted: #9fadbc;
      --border: #3a434b; --shadow: 0 1px 2px rgba(0,0,0,.5); --hover: rgba(255,255,255,.06);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  header { flex-wrap: wrap; row-gap: 8px; }
  header h1 { font-size: 18px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 6em; flex: 0 1 auto; }
  #modes { display: flex; gap: 4px; flex-wrap: wrap; }
  header .spacer { flex: 1; }
  header input { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--text); width: 220px; }
  .icon-btn { background: none; border: none; padding: 6px 8px; border-radius: 6px; font-size: 18px; line-height: 1; color: var(--text); cursor: pointer; }
  .icon-btn:hover { background: var(--hover); }
  .status { font-size: 12px; color: var(--muted); }
  .board { display: flex; gap: 12px; padding: 16px; overflow-x: auto; align-items: flex-start; min-height: calc(100vh - 58px); }
  .column { background: var(--col); border-radius: 8px; width: 280px; min-width: 280px; display: flex; flex-direction: column; max-height: calc(100vh - 90px); }
  .column h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0; padding: 10px 12px; display: flex; justify-content: space-between; }
  .cards { padding: 0 8px; overflow-y: auto; min-height: 40px; flex: 1; }
  .column.drop .cards { outline: 2px dashed var(--accent); outline-offset: -4px; border-radius: 6px; }
  .card { background: var(--card); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; box-shadow: var(--shadow); cursor: pointer; border-left: 3px solid var(--medium); }
  .card.dragging { opacity: .4; }
  .card.drop-before { box-shadow: 0 -3px 0 var(--accent), var(--shadow); }
  .card .title { font-weight: 500; word-break: break-word; }
  .card .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; font-size: 11px; color: var(--muted); align-items: center; }
  .pill { padding: 1px 6px; border-radius: 10px; background: var(--col); }
  .pill.agent { background: var(--accent); color: #fff; }
  .pill.project { border: 1px solid var(--border); background: transparent; }
  .pill.bug { background: color-mix(in srgb, var(--urgent) 15%, transparent); color: var(--urgent); }
  .pill.decision { background: color-mix(in srgb, var(--high) 20%, transparent); color: color-mix(in srgb, var(--high) 70%, var(--text)); }
  .pill.decided { background: color-mix(in srgb, #36b37e 18%, transparent); color: color-mix(in srgb, #36b37e 75%, var(--text)); }
  .column[data-column="bugs"] { border-top: 3px solid var(--urgent); }
  .column[data-column="decisions"] { border-top: 3px solid var(--high); }
  .column[data-column="bugs"] h2 > span:first-child::before { content: "🐞 "; }
  .column[data-column="decisions"] h2 > span:first-child::before { content: "❓ "; }
  .badge { display: none; white-space: nowrap; padding: 4px 10px; border-radius: 12px; border: none; font-size: 12px; font-weight: 600; cursor: pointer;
    background: color-mix(in srgb, var(--high) 22%, transparent); color: color-mix(in srgb, var(--high) 70%, var(--text)); }
  .badge.show { display: inline-block; }
  /* Author display rules (e.g. .decision-panel's grid) beat the UA's [hidden] style, so restore it for everything. */
  [hidden] { display: none !important; }
  .decision-panel { display: grid; gap: 8px; padding: 12px; border-radius: 8px; background: color-mix(in srgb, var(--high) 10%, var(--card)); border: 1px solid color-mix(in srgb, var(--high) 35%, transparent); }
  .decision-panel h4 { margin: 0; font-size: 12px; text-transform: uppercase; color: var(--muted); }
  .decision-panel .rec { font-size: 13px; white-space: pre-wrap; }
  .decision-panel .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .decision-panel .opts button { text-align: left; }
  .decision-panel .opts button.recommended { border-color: var(--accent); }
  .decision-panel .answer { font-weight: 600; white-space: pre-wrap; }
  .related { font-size: 12px; color: var(--muted); }
  header select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--text); font: inherit; font-size: 13px; }
  .mode { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); white-space: nowrap; }
  .toggles { display: grid; gap: 10px; }
  .toggle { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: start; cursor: pointer; }
  .toggle input { width: auto; margin: 3px 0 0; grid-row: span 2; }
  .toggle strong { font-size: 13px; }
  .toggle span { font-size: 12px; color: var(--muted); }
  .route { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .route select { width: auto; padding: 4px 8px; }
  .related a { color: inherit; }
  .p-low { border-left-color: var(--low); } .p-medium { border-left-color: var(--medium); }
  .p-high { border-left-color: var(--high); } .p-urgent { border-left-color: var(--urgent); }
  .add { padding: 8px; }
  .add input { width: 100%; padding: 7px 9px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--text); }
  .add input:focus { background: var(--card); border-color: var(--border); outline: none; }

  /* project drawer */
  .scrim { position: fixed; inset: 0; background: rgba(9,30,66,.35); opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 10; }
  .drawer { position: fixed; top: 0; left: 0; bottom: 0; width: min(300px, 86vw); background: var(--card);
    transform: translateX(-100%); transition: transform .18s ease; z-index: 11; display: flex; flex-direction: column; }
  body.menu-open .scrim { opacity: 1; pointer-events: auto; }
  body.menu-open .drawer { transform: none; box-shadow: 2px 0 16px rgba(0,0,0,.2); }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--border); }
  .drawer-head h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0; }
  .project-list { list-style: none; margin: 0; padding: 8px; overflow-y: auto; flex: 1; }
  .project-list li { display: flex; align-items: center; gap: 4px; border-radius: 6px; }
  .project-list li:hover { background: var(--hover); }
  .project-list li.active { background: var(--col); }
  .project-list a { flex: 1; min-width: 0; padding: 8px 10px; color: inherit; text-decoration: none; display: grid; }
  .project-list .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .project-list .sub { font-size: 11px; color: var(--muted); }
  .project-list .icon-btn { font-size: 14px; color: var(--muted); }
  .project-list .divider { height: 1px; background: var(--border); margin: 6px 4px; }
  .drawer-foot { padding: 10px; border-top: 1px solid var(--border); }
  .drawer-foot input { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); }

  dialog { border: none; border-radius: 10px; padding: 0; width: min(640px, 94vw); background: var(--card); color: var(--text); box-shadow: 0 8px 40px rgba(0,0,0,.3); }
  #ask { width: min(420px, 94vw); }
  #ask p { margin: 0; white-space: pre-wrap; }
  dialog::backdrop { background: rgba(9,30,66,.5); }
  .modal { padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .modal h3 { margin: 0; font-size: 16px; }
  .modal input, .modal textarea, .modal select { width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  .modal textarea { min-height: 110px; resize: vertical; }
  .modal .title-input { font-size: 18px; font-weight: 600; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .row label, .field label { font-size: 11px; color: var(--muted); text-transform: uppercase; display: grid; gap: 4px; }
  .commits { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
  .commits code { font: 12px ui-monospace, Menlo, monospace; padding: 1px 6px; border-radius: 4px; background: var(--bg); }
  .activity { max-height: 220px; overflow-y: auto; border-top: 1px solid var(--border); padding-top: 8px; }
  .entry { font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .entry .who { font-weight: 600; } .entry .when { color: var(--muted); font-size: 11px; margin-left: 6px; }
  .entry.event { color: var(--muted); font-size: 12px; }
  .entry .body { white-space: pre-wrap; margin-top: 2px; }
  .actions { display: flex; gap: 8px; justify-content: space-between; }
  .hint { font-size: 12px; color: var(--muted); margin: 0; }
  .paths { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .paths li { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--bg); border-radius: 6px; font: 12px ui-monospace, Menlo, monospace; }
  .paths li span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .paths .icon-btn { font-size: 13px; padding: 2px 6px; }
  .add-path { display: flex; gap: 8px; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 6px; }
  .suggestions button { padding: 3px 8px; font: 12px ui-monospace, Menlo, monospace; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { padding: 7px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--col); color: var(--text); cursor: pointer; font: inherit; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--urgent); }
  @media (max-width: 600px) { .row { grid-template-columns: 1fr 1fr; } header input { width: 120px; } }
</style>
</head>
<body>
<header>
  <button class="icon-btn" id="menu-btn" aria-label="Projects menu">☰</button>
  <h1 id="project-title">Kanban Vibes</h1>
  <span id="modes"></span>
  <span class="status" id="status"></span>
  <span class="spacer"></span>
  <button class="badge" id="decision-badge" title="Decisions waiting on you"></button>
  <select id="sort" aria-label="Sort tasks">
    <option value="priority">Sort: Priority</option>
    <option value="created">Sort: Newest</option>
    <option value="updated">Sort: Last updated</option>
    <option value="manual">Sort: Manual</option>
  </select>
  <select id="kind-filter" aria-label="Filter by type">
    <option value="">All types</option>
    <option value="task">Tasks</option>
    <option value="bug">Bugs</option>
    <option value="decision">Decisions</option>
  </select>
  <input id="filter" placeholder="Filter tasks…" />
</header>
<main class="board" id="board"></main>

<div class="scrim" id="scrim"></div>
<nav class="drawer" aria-label="Projects">
  <div class="drawer-head"><h2>Projects</h2><button class="icon-btn" id="menu-close" aria-label="Close menu">✕</button></div>
  <ul class="project-list" id="project-list"></ul>
  <div class="drawer-foot"><input id="new-project" placeholder="+ New project (Enter)" /></div>
</nav>

<dialog id="dialog">
  <form class="modal" method="dialog" id="form">
    <input class="title-input" name="title" required />
    <div class="row">
      <label>Project<select name="projectId"></select></label>
      <label>Column<select name="column"></select></label>
      <label>Type<select name="kind"><option value="task">Task</option><option value="bug">Bug</option><option value="decision">Decision</option></select></label>
      <label>Priority<select name="priority"></select></label>
      <label>Assignee<input name="assignee" placeholder="unassigned" /></label>
    </div>
    <div class="related" id="related" hidden></div>
    <div class="field"><label>Description<textarea name="description" placeholder="Details, acceptance criteria, context for Claude…"></textarea></label></div>
    <div class="decision-panel" id="decision-panel" hidden></div>
    <div class="field" id="commits" hidden></div>
    <div class="activity" id="activity"></div>
    <div class="field"><label>Comment<textarea name="comment" style="min-height:50px" placeholder="Add a comment…"></textarea></label></div>
    <div class="actions">
      <button type="button" class="danger" id="delete">Delete</button>
      <span>
        <button type="button" id="cancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </span>
    </div>
  </form>
</dialog>

<dialog id="ask">
  <form class="modal" method="dialog">
    <p id="ask-msg"></p>
    <div class="actions"><span></span><span>
      <button value="cancel" id="ask-cancel">Cancel</button>
      <button value="ok" class="primary" id="ask-ok">OK</button>
    </span></div>
  </form>
</dialog>

<dialog id="project-dialog">
  <form class="modal" method="dialog" id="project-form">
    <h3>Project settings</h3>
    <div class="field"><label>Name<input name="name" required /></label></div>
    <div class="field">
      <label>Linked folders</label>
      <p class="hint">Claude Code sessions started in these folders (or any subfolder) work on this project's board.</p>
    </div>
    <ul class="paths" id="paths"></ul>
    <div class="add-path">
      <input name="newPath" placeholder="/absolute/path/to/repo" list="claude-folders" />
      <button type="button" id="add-path">Link</button>
    </div>
    <datalist id="claude-folders"></datalist>
    <div class="field"><label>Claude workflow</label></div>
    <div class="toggles">
      <label class="toggle"><input type="checkbox" name="autofixBugs" />
        <strong>Autofix bugs</strong>
        <span>Claude may route the bugs it finds itself (to To do, In progress or Decisions) and work on them, instead of waiting for you to triage them out of Bugs.</span></label>
      <label class="toggle"><input type="checkbox" name="chatDecisions" />
        <strong>Decisions from chat</strong>
        <span>When you answer a decision in a Claude Code chat, Claude records your answer (quoting you) and carries on, instead of waiting for you to answer on the board.</span></label>
    </div>
    <div class="field" id="suggest-wrap">
      <label>Recent Claude Code folders</label>
      <div class="suggestions" id="suggestions"></div>
    </div>
    <div class="actions">
      <button type="button" class="danger" id="project-delete">Delete project</button>
      <span>
        <button type="button" id="project-cancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </span>
    </div>
  </form>
</dialog>

<script>
const LABELS = { bugs: 'Bugs', decisions: 'Decisions', backlog: 'Backlog', todo: 'To do', in_progress: 'In progress', review: 'Review', done: 'Done' };
let state = { columns: [], priorities: [], projects: [], tasks: [] };
let dragId = null;
let editingId = null;
let editingProject = null; // { id, name, paths } draft while the project dialog is open
let needsRender = false;

const PRIORITY_RANK = { urgent: 0, high: 1, medium: 2, low: 3 };
// Each sort falls back to the manual order so ties stay stable.
const SORTS = {
  priority: (a, b) => PRIORITY_RANK[a.priority] - PRIORITY_RANK[b.priority] || a.order - b.order,
  created: (a, b) => b.createdAt.localeCompare(a.createdAt) || a.order - b.order,
  updated: (a, b) => b.updatedAt.localeCompare(a.updatedAt) || a.order - b.order,
  manual: (a, b) => a.order - b.order,
};
const isManual = () => $('#sort').value === 'manual';

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ago = (iso) => {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return new Date(iso).toLocaleDateString();
};

// In-page replacements for confirm() and alert(). Embedded browsers (e.g. the Claude desktop app's browser
// pane) can suppress native dialogs, which made confirm() return false instantly and Delete do nothing (#15).
function ask(message, { ok = 'OK', danger = false, cancel = true } = {}) {
  const dlg = $('#ask');
  $('#ask-msg').textContent = message;
  $('#ask-ok').textContent = ok;
  $('#ask-ok').className = danger ? 'danger' : 'primary';
  $('#ask-cancel').hidden = !cancel;
  dlg.returnValue = '';
  dlg.showModal();
  $('#ask-ok').focus();
  return new Promise((resolve) => dlg.addEventListener('close', () => resolve(dlg.returnValue === 'ok'), { once: true }));
}
const uiConfirm = (message, opts) => ask(message, opts);
const uiAlert = (message) => ask(message, { cancel: false });

async function api(method, url, body) {
  const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

// ---------- selected project (kept in the URL hash: #p=3 or #all) ----------

function selection() {
  const h = location.hash.slice(1);
  if (h === 'all') return 'all';
  const id = Number(new URLSearchParams(h).get('p'));
  return id || null;
}
const isAll = () => selection() === 'all';
const currentProject = () => state.projects.find((p) => p.id === selection());
const projectName = (id) => state.projects.find((p) => p.id === id)?.name ?? '?';

function selectProject(id) {
  location.hash = id === 'all' ? 'all' : `p=${id}`;
}

window.addEventListener('hashchange', () => { state.tasks = []; closeMenu(); refresh(true); });

async function refresh(force = false) {
  try {
    const sel = selection();
    const next = await api('GET', sel && sel !== 'all' ? `/api/board?project=${sel}` : '/api/board');
    // No (or a deleted) project selected: fall back to the first project.
    if (sel !== 'all' && !next.projects.some((p) => p.id === sel)) return selectProject(next.projects[0].id);
    if (force || JSON.stringify(next) !== JSON.stringify(state)) needsRender = true;
    state = next;
    $('#status').textContent = '';
    // Don't clobber an in-progress drag or a half-typed input; render on a later tick instead.
    const typing = document.activeElement?.matches('.add input, #new-project') && document.activeElement.value;
    if (needsRender && dragId === null && !typing) {
      needsRender = false;
      render();
    }
  } catch {
    $('#status').textContent = 'offline — retrying';
  }
}

// ---------- rendering ----------

function render() {
  const all = isAll();
  const project = currentProject();
  $('#project-title').textContent = all ? 'All projects' : project?.name ?? 'Kanban Vibes';
  const s = !all && project?.settings;
  $('#modes').innerHTML = s
    ? [s.autofixBugs && '<span class="mode" title="Claude routes bugs itself">⚡ Autofix bugs</span>',
       s.chatDecisions && '<span class="mode" title="Claude records decisions you make in chat">💬 Chat decisions</span>'].filter(Boolean).join(' ')
    : '';
  document.title = `${all ? 'All projects' : project?.name ?? ''} · Kanban Vibes`;
  renderMenu();
  // Answered decisions leave the decisions column, so whatever is in it is waiting on the user.
  const waiting = state.projects.reduce((n, p) => n + (p.counts.decisions || 0), 0);
  const badge = $('#decision-badge');
  badge.textContent = `❓ ${waiting} decision${waiting === 1 ? '' : 's'} waiting`;
  badge.classList.toggle('show', waiting > 0);

  const q = $('#filter').value.toLowerCase();
  const kind = $('#kind-filter').value;
  const board = $('#board');
  board.innerHTML = '';
  for (const col of state.columns) {
    const tasks = state.tasks
      .filter((t) => t.column === col)
      .filter((t) => !kind || t.kind === kind)
      .filter((t) => !q || `${t.title} ${t.description} ${t.assignee ?? ''}`.toLowerCase().includes(q))
      .sort(SORTS[$('#sort').value] ?? SORTS.manual);
    const el = document.createElement('section');
    el.className = 'column';
    el.dataset.column = col;
    el.innerHTML = `<h2><span>${LABELS[col] ?? col}</span><span>${tasks.length}</span></h2><div class="cards"></div>
      ${all ? '' : '<div class="add"><input placeholder="+ Add task" /></div>'}`;
    const cards = $('.cards', el);
    for (const t of tasks) cards.appendChild(cardEl(t, all));
    $('.add input', el)?.addEventListener('keydown', async (e) => {
      if (e.key !== 'Enter' || !e.target.value.trim()) return;
      await api('POST', '/api/tasks', { title: e.target.value.trim(), column: col, projectId: selection() });
      e.target.value = '';
      await refresh();
      $(`[data-column="${col}"] .add input`).focus();
    });
    wireDrop(el);
    board.appendChild(el);
  }
}

function renderMenu() {
  const sel = selection();
  const open = (p) => Object.entries(p.counts).filter(([c]) => c !== 'done').reduce((n, [, v]) => n + v, 0);
  const totalOpen = state.projects.reduce((n, p) => n + open(p), 0);
  const item = (id, name, sub, editable) => `<li class="${sel === id ? 'active' : ''}">
      <a href="#${id === 'all' ? 'all' : `p=${id}`}"><span class="name">${esc(name)}</span><span class="sub">${sub}</span></a>
      ${editable ? `<button class="icon-btn" data-edit="${id}" aria-label="Project settings" title="Project settings">⚙</button>` : ''}
    </li>`;
  $('#project-list').innerHTML =
    item('all', 'All projects', `${totalOpen} open`, false) +
    '<li class="divider" role="separator"></li>' +
    state.projects
      .map((p) => item(p.id, p.name, [
        `${open(p)} open`,
        p.counts.decisions && `❓ ${p.counts.decisions}`,
        p.counts.bugs && `🐞 ${p.counts.bugs}`,
        p.paths.length ? `🔗 ${p.paths.length} folder${p.paths.length > 1 ? 's' : ''}` : 'not linked',
      ].filter(Boolean).join(' · '), true))
      .join('');
}

function cardEl(t, showProject) {
  const el = document.createElement('article');
  el.className = `card p-${t.priority}`;
  el.draggable = true;
  el.dataset.id = t.id;
  const isAgent = t.assignee && /claude|agent/i.test(t.assignee);
  el.innerHTML = `<div class="title">${esc(t.title)}</div>
    <div class="meta">
      <span>#${t.id}</span>
      ${showProject ? `<span class="pill project">${esc(projectName(t.projectId))}</span>` : ''}
      ${t.kind === 'bug' ? '<span class="pill bug">bug</span>' : ''}
      ${t.kind === 'decision' ? (t.answer ? '<span class="pill decided">✓ decided</span>' : '<span class="pill decision">needs decision</span>') : ''}
      ${t.priority !== 'medium' ? `<span class="pill">${t.priority}</span>` : ''}
      ${t.assignee ? `<span class="pill ${isAgent ? 'agent' : ''}" title="${t.column === 'in_progress' ? 'Locked: claimed by ' + esc(t.assignee) : ''}">${t.column === 'in_progress' ? '🔒 ' : ''}${esc(t.assignee)}</span>` : ''}
      ${t.commits?.length ? `<span title="Linked commits">⎇ ${t.commits.length}</span>` : ''}
      ${t.activity.some((a) => a.kind === 'comment') ? `<span>💬 ${t.activity.filter((a) => a.kind === 'comment').length}</span>` : ''}
      <span style="margin-left:auto">${ago(t.updatedAt)}</span>
    </div>`;
  el.addEventListener('click', () => openTask(t.id));
  el.addEventListener('dragstart', (e) => { dragId = t.id; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
  el.addEventListener('dragend', () => { dragId = null; render(); });
  return el;
}

// ---------- drag and drop ----------

function wireDrop(colEl) {
  const clear = () => document.querySelectorAll('.drop, .drop-before').forEach((n) => n.classList.remove('drop', 'drop-before'));
  colEl.addEventListener('dragover', (e) => {
    if (dragId === null) return;
    e.preventDefault();
    clear();
    colEl.classList.add('drop');
    const before = e.target.closest('.card');
    if (before && Number(before.dataset.id) !== dragId && !isAll() && isManual()) before.classList.add('drop-before');
  });
  colEl.addEventListener('dragleave', (e) => { if (!colEl.contains(e.relatedTarget)) clear(); });
  colEl.addEventListener('drop', async (e) => {
    e.preventDefault();
    const before = e.target.closest('.card');
    clear();
    const id = dragId;
    dragId = null;
    if (id === null) return;
    await moveTask(id, colEl.dataset.column, before ? Number(before.dataset.id) : null);
  });
}

// Insert the dragged task before `beforeId` (or at the end) and renumber the column.
// Order is per project, so the mixed "All projects" view only changes the column,
// and so does any sort other than manual, where the drop position means nothing.
async function moveTask(id, column, beforeId) {
  if (isAll() || !isManual()) {
    if (state.tasks.find((t) => t.id === id)?.column === column) return;
    await api('PATCH', `/api/tasks/${id}`, { column });
    return refresh();
  }
  const ids = state.tasks.filter((t) => t.column === column && t.id !== id).map((t) => t.id);
  const idx = beforeId === null ? ids.length : ids.indexOf(beforeId);
  ids.splice(idx < 0 ? ids.length : idx, 0, id);
  const updates = [];
  ids.forEach((tid, order) => {
    const t = state.tasks.find((x) => x.id === tid);
    if (tid === id) updates.push(api('PATCH', `/api/tasks/${tid}`, { column, order }));
    else if (t.order !== order) updates.push(api('PATCH', `/api/tasks/${tid}`, { order }));
  });
  await Promise.all(updates);
  await refresh();
}

// ---------- task dialog ----------

function openTask(id) {
  const t = state.tasks.find((x) => x.id === id);
  if (!t) return;
  editingId = id;
  const f = $('#form');
  f.projectId.innerHTML = state.projects.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
  f.column.innerHTML = state.columns.map((c) => `<option value="${c}">${LABELS[c] ?? c}</option>`).join('');
  f.priority.innerHTML = state.priorities.map((p) => `<option>${p}</option>`).join('');
  f.title.value = t.title;
  f.projectId.value = t.projectId;
  f.column.value = t.column;
  f.priority.value = t.priority;
  f.kind.value = t.kind;
  f.assignee.value = t.assignee ?? '';
  f.description.value = t.description;
  f.comment.value = '';
  renderRelated(t);
  renderDecision(t);
  const commits = t.commits ?? [];
  $('#commits').hidden = !commits.length;
  $('#commits').innerHTML = `<label>Commits</label><ul class="commits">${commits.map((c) =>
    `<li><code title="${esc(c.sha)}">${esc(c.sha.slice(0, 7))}</code> ${esc(c.message)}</li>`).join('')}</ul>`;
  $('#activity').innerHTML = [...t.activity].reverse().map((a) => `<div class="entry ${a.kind}">
      <span class="who">${esc(a.author)}</span><span class="when">${ago(a.at)}</span>
      <div class="body">${esc(a.text)}</div></div>`).join('');
  $('#dialog').showModal();
}

function renderRelated(t) {
  const el = $('#related');
  const label = { decision: 'Blocks', bug: 'Found while working on' }[t.kind] ?? 'Related to';
  const rel = t.relatedTaskId && state.tasks.find((x) => x.id === t.relatedTaskId);
  el.hidden = !t.relatedTaskId;
  el.innerHTML = t.relatedTaskId
    ? `${label} ${rel ? `<a href="#" data-open="${rel.id}">#${rel.id} ${esc(rel.title)}</a>` : `#${t.relatedTaskId}`}`
    : '';
}
$('#related').addEventListener('click', (e) => {
  const a = e.target.closest('[data-open]');
  if (!a) return;
  e.preventDefault();
  openTask(Number(a.dataset.open));
});

// Decisions: show the options Claude offered as one-click answers, or the answer once given.
function renderDecision(t) {
  const el = $('#decision-panel');
  el.hidden = t.kind !== 'decision';
  if (el.hidden) return;
  if (t.answer) {
    el.innerHTML = `<h4>Decided ${ago(t.answeredAt)}</h4><div class="answer">${esc(t.answer)}</div>
      <div class="opts"><button type="button" data-reopen>Reopen decision</button></div>
      <p class="hint">Reopening takes the answer back: the decision returns to Decisions, the old answer stays in the history, and the task it blocks is told not to act on it. Anything typed in the comment box is recorded as the reason.</p>`;
    return;
  }
  const opts = t.options ?? [];
  el.innerHTML = `<h4>Your decision</h4>
    ${t.recommendation ? `<div class="rec"><strong>Claude recommends:</strong> ${esc(t.recommendation)}</div>` : ''}
    ${opts.length ? `<div class="opts">${opts.map((o, i) => `<button type="button" data-answer="${i}">${esc(o)}</button>`).join('')}</div>` : ''}
    <div class="opts"><button type="button" data-answer="custom">Answer with my comment</button></div>
    <label class="route">Then move it to
      <select id="decision-route"><option value="todo">To do (Claude acts on it)</option><option value="backlog">Backlog (park it)</option></select></label>
    <p class="hint">Picking an option answers the decision. Anything typed in the comment box is added to the answer.</p>`;
  // Highlight the option the recommendation quotes; the longest match wins so "Soft delete" doesn't
  // light up when "Soft delete + purge" is the one recommended.
  const rec = t.recommendation?.toLowerCase() ?? '';
  const best = opts.reduce((b, o, i) => (rec.includes(o.toLowerCase()) && (b < 0 || o.length > opts[b].length) ? i : b), -1);
  if (best >= 0) el.querySelector(`[data-answer="${best}"]`).classList.add('recommended');
}
$('#decision-panel').addEventListener('click', async (e) => {
  if (e.target.closest('[data-reopen]')) {
    const t = state.tasks.find((x) => x.id === editingId);
    const held = t.assignee ? ` ${t.assignee} has it claimed and may already be acting on it.` : '';
    if (!(await uiConfirm(`Reopen decision #${t.id}? Its answer "${t.answer}" will no longer apply.${held}`, { ok: 'Reopen' }))) return;
    try {
      await api('POST', `/api/tasks/${t.id}/reopen`, { reason: $('#form').comment.value.trim() || undefined });
      $('#dialog').close();
      await refresh(true);
    } catch (err) {
      uiAlert(err.message);
    }
    return;
  }
  const b = e.target.closest('[data-answer]');
  if (!b) return;
  const t = state.tasks.find((x) => x.id === editingId);
  const comment = $('#form').comment.value.trim();
  const choice = b.dataset.answer === 'custom' ? '' : t.options[Number(b.dataset.answer)];
  const answer = [choice, comment].filter(Boolean).join(' — ');
  if (!answer) return uiAlert('Type your answer in the comment box first.');
  try {
    await api('POST', `/api/tasks/${t.id}/decide`, { answer, column: $('#decision-route').value });
    $('#dialog').close();
    await refresh(true);
  } catch (err) {
    uiAlert(err.message);
  }
});

$('#decision-badge').addEventListener('click', () => {
  const p = currentProject();
  if (!p || !p.counts.decisions) selectProject('all');
  document.querySelector('[data-column="decisions"]')?.scrollIntoView({ behavior: 'smooth', inline: 'start' });
});

$('#form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const id = editingId;
  await api('PATCH', `/api/tasks/${id}`, {
    title: f.title.value,
    projectId: Number(f.projectId.value),
    column: f.column.value,
    priority: f.priority.value,
    kind: f.kind.value,
    assignee: f.assignee.value.trim() || null,
    description: f.description.value,
  });
  if (f.comment.value.trim()) await api('POST', `/api/tasks/${id}/comments`, { text: f.comment.value.trim() });
  $('#dialog').close();
  await refresh();
});
$('#cancel').addEventListener('click', () => $('#dialog').close());
$('#delete').addEventListener('click', async () => {
  const t = state.tasks.find((x) => x.id === editingId);
  if (!(await uiConfirm(`Delete #${t.id} "${t.title}"? This cannot be undone.`, { ok: 'Delete', danger: true }))) return;
  try {
    await api('DELETE', `/api/tasks/${t.id}`);
    $('#dialog').close();
    await refresh(true);
  } catch (err) {
    uiAlert(err.message);
  }
});

// ---------- project menu ----------

const openMenu = () => document.body.classList.add('menu-open');
const closeMenu = () => document.body.classList.remove('menu-open');
$('#menu-btn').addEventListener('click', openMenu);
$('#menu-close').addEventListener('click', closeMenu);
$('#scrim').addEventListener('click', closeMenu);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });
$('#project-list').addEventListener('click', (e) => {
  const edit = e.target.closest('[data-edit]');
  if (edit) openProject(Number(edit.dataset.edit));
  else if (e.target.closest('a')) closeMenu();
});
$('#new-project').addEventListener('keydown', async (e) => {
  if (e.key !== 'Enter' || !e.target.value.trim()) return;
  try {
    const p = await api('POST', '/api/projects', { name: e.target.value.trim() });
    e.target.value = '';
    selectProject(p.id);
    await refresh(true);
    openProject(p.id); // straight into linking folders
  } catch (err) {
    uiAlert(err.message);
  }
});

// ---------- project dialog ----------

async function openProject(id) {
  const p = state.projects.find((x) => x.id === id);
  if (!p) return;
  editingProject = { id: p.id, paths: [...p.paths] };
  $('#project-form').name.value = p.name;
  $('#project-form').autofixBugs.checked = p.settings.autofixBugs;
  $('#project-form').chatDecisions.checked = p.settings.chatDecisions;
  $('#project-form').newPath.value = '';
  renderPaths();
  closeMenu();
  $('#project-dialog').showModal();
  // Suggest folders Claude Code has been used in, newest first.
  const folders = await api('GET', '/api/claude-projects').catch(() => []);
  editingProject.folders = folders;
  renderPaths();
}

function renderPaths() {
  const ep = editingProject;
  $('#paths').innerHTML = ep.paths.length
    ? ep.paths.map((p, i) => `<li><span title="${esc(p)}">‎${esc(p)}</span><button type="button" class="icon-btn" data-unlink="${i}" aria-label="Unlink">✕</button></li>`).join('')
    : '<li><em style="font-family:inherit;color:var(--muted)">No folders linked yet</em></li>';
  const folders = ep.folders ?? [];
  const free = folders.filter((f) => !ep.paths.includes(f.path) && (f.linkedProjectId === null || f.linkedProjectId === ep.id));
  $('#claude-folders').innerHTML = free.map((f) => `<option value="${esc(f.path)}">`).join('');
  $('#suggestions').innerHTML = free.slice(0, 8).map((f) => `<button type="button" data-link="${esc(f.path)}" title="${esc(f.path)} · active ${ago(f.lastActive)}">+ ${esc(f.path.split('/').pop())}</button>`).join('');
  $('#suggest-wrap').hidden = !free.length;
}

function addPath(p) {
  p = p.trim().replace(/\/+$/, '');
  if (!p) return;
  if (!p.startsWith('/')) return uiAlert('Folder must be an absolute path');
  if (!editingProject.paths.includes(p)) editingProject.paths.push(p);
  $('#project-form').newPath.value = '';
  renderPaths();
}

$('#add-path').addEventListener('click', () => addPath($('#project-form').newPath.value));
$('#project-form').newPath.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); addPath(e.target.value); }
});
$('#suggestions').addEventListener('click', (e) => { const b = e.target.closest('[data-link]'); if (b) addPath(b.dataset.link); });
$('#paths').addEventListener('click', (e) => {
  const b = e.target.closest('[data-unlink]');
  if (!b) return;
  editingProject.paths.splice(Number(b.dataset.unlink), 1);
  renderPaths();
});
$('#project-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await api('PATCH', `/api/projects/${editingProject.id}`, {
      name: e.target.name.value,
      paths: editingProject.paths,
      settings: { autofixBugs: e.target.autofixBugs.checked, chatDecisions: e.target.chatDecisions.checked },
    });
    $('#project-dialog').close();
    await refresh(true);
  } catch (err) {
    uiAlert(err.message);
  }
});
$('#project-cancel').addEventListener('click', () => $('#project-dialog').close());
$('#project-delete').addEventListener('click', async () => {
  const p = state.projects.find((x) => x.id === editingProject.id);
  const n = Object.values(p.counts).reduce((a, b) => a + b, 0);
  if (!(await uiConfirm(`Delete project "${p.name}"${n ? ` and its ${n} task${n > 1 ? 's' : ''}` : ''}? This cannot be undone.`, { ok: 'Delete project', danger: true }))) return;
  try {
    await api('DELETE', `/api/projects/${p.id}`);
    $('#project-dialog').close();
    if (selection() === p.id) selectProject('all');
    else await refresh(true);
  } catch (err) {
    uiAlert(err.message);
  }
});

$('#filter').addEventListener('input', render);
$('#kind-filter').addEventListener('change', render);
try { const s = localStorage.getItem('kanban-sort'); if (s && SORTS[s]) $('#sort').value = s; } catch {}
$('#sort').addEventListener('change', () => {
  try { localStorage.setItem('kanban-sort', $('#sort').value); } catch {}
  render();
});

refresh(true);
setInterval(refresh, 2000); // pick up changes Claude makes via the MCP server
</script>
</body>
</html>
